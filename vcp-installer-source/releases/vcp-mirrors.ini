; VCP Installer 镜像配置文件
;
; 说明：
;   - 将此文件放在 vcp-installer.exe 同级目录
;   - 每一行一个镜像地址：显示名称 = URL
;   - ; 开头为注释行，会被忽略
;   - 空行会被忽略
;   - 顺序不重要，程序启动时会自动检测速度并排序
;   - 如果文件不存在，程序使用内置默认镜像列表

