[npm]
; npm registry 镜像（用于 npm install）
; 格式：显示名称 = registry 完整URL

npmmirror(淘宝) = https://registry.npmmirror.com/
taobao(备用) = https://registry.npm.taobao.org/
cnpm = https://r.cnpmjs.org/

[pip]
; pip 包镜像（用于 pip install）
; 格式：显示名称 = simple API 完整URL

阿里云 = https://mirrors.aliyun.com/pypi/simple/
中科大 = https://pypi.mirrors.ustc.edu.cn/simple/
腾讯云 = https://mirrors.cloud.tencent.com/pypi/simple/

[msvc]
; MSVC Build Tools download mirrors (for vs_BuildTools.exe bootstrap)
; Format: display_name = full download URL
; These are the bootstrap installer URLs (~1-4 MB), NOT the full package

Microsoft Official = https://aka.ms/vs/17/release/vs_BuildTools.exe
Azure Blob = https://vsdownload.blob.core.windows.net/release/vs_BuildTools.exe

[component_commits]
; 组件 commit 版本记录（镜像测试阶段自动生成）
VCPDistributedServer = 55dfd685fcf132e975db41ebce9892aea00b8643
VCPChat = fb799f747fc90e81b0bcc80b0eb59b43c9f47be6
VCPBackUpDEV = 544629ec2377b2c58fd46cd0ac077f415d4b3c57

[runtime_versions]
; 运行时版本号记录（安装时自动生成，用于缓存校验）
Node.js = v24.19.0
PortableGit = v2.55.0.windows.5
Python = cpython-3.14.7+20260814-x86_64-pc-windows-msvc-install_only.tar.gz
NewAPI = v1.0.0-rc.25

[preferred_github]
; 安装时自动生成，当前优选站点（最多3个）
