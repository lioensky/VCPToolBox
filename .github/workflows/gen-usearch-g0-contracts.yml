name: Gen-USearch G0 Contracts

on:
  push:
    branches:
      - main
      - codex/gen-usearch-g0-f2-upstream-main
    paths:
      - 'contracts/gen-usearch/g0/**'
      - 'tests/gen-usearch/g0/**'
      - '.github/workflows/gen-usearch-g0-contracts.yml'
  pull_request:
    paths:
      - 'contracts/gen-usearch/g0/**'
      - 'tests/gen-usearch/g0/**'
      - '.github/workflows/gen-usearch-g0-contracts.yml'

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      G0_AUTHORITY_LOCK_SHA256: ${{ vars.G0_AUTHORITY_LOCK_SHA256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Verify external authority pin
        shell: bash
        run: |
          test -n "$G0_AUTHORITY_LOCK_SHA256"
          actual="$(sha256sum contracts/gen-usearch/g0/g0-authority-lock.json | awk '{print $1}')"
          test "$actual" = "$G0_AUTHORITY_LOCK_SHA256"

      - name: Install pinned schema validator
        run: npm ci --prefix tests/gen-usearch/g0 --ignore-scripts --no-audit --no-fund

      - name: Run G0 deterministic contract gate
        run: node --test tests/gen-usearch/g0/g0-contracts.test.js

      - name: Generate canonical G0 acceptance manifest
        run: node tests/gen-usearch/g0/g0-runner.js | tee /tmp/g0-acceptance.json
