name: Gen-USearch Native Rebuild

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: vexus-lite.linux-x64-gnu.node
          - os: ubuntu-24.04-arm
            artifact: vexus-lite.linux-arm64-gnu.node
          - os: macos-14
            artifact: vexus-lite.darwin-arm64.node
          - os: windows-2025
            artifact: vexus-lite.win32-x64-msvc.node
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install N-API CLI
        shell: bash
        run: npm install --prefix rust-vexus-lite --ignore-scripts --no-save --package-lock=false --no-audit --no-fund @napi-rs/cli@2.16.0
      - name: Build host native artifact
        shell: bash
        run: |
          cd rust-vexus-lite
          ./node_modules/.bin/napi build --platform --release
          test -f "${{ matrix.artifact }}"
      - name: Upload host native artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.artifact }}
          path: rust-vexus-lite/${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 1

  musl-native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: vexus-lite.linux-x64-musl.node
          - os: ubuntu-24.04-arm
            artifact: vexus-lite.linux-arm64-musl.node
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build musl native artifact in Alpine
        shell: bash
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work/rust-vexus-lite \
            rust:1.90-alpine3.22 \
            sh -lc 'apk add --no-cache nodejs npm build-base cmake python3 pkgconf && npm install --ignore-scripts --no-save --package-lock=false --no-audit --no-fund @napi-rs/cli@2.16.0 && ./node_modules/.bin/napi build --platform --release'
          test -f "rust-vexus-lite/${{ matrix.artifact }}"
      - name: Upload musl native artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.artifact }}
          path: rust-vexus-lite/${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 1
