name: Gen-USearch G2 Physical Layer

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - codex/gen-usearch-g0-f2-upstream-main
    paths:
      - 'contracts/gen-usearch/g2/**'
      - 'contracts/gen-usearch/g1/**'
      - 'KnowledgeBaseManager.js'
      - 'config.env.example'
      - 'modules/knowledgeBase/indexRepository.js'
      - 'modules/knowledgeBase/schemaManager.js'
      - 'modules/knowledgeBase/genUSearchMetadataStore.js'
      - 'modules/knowledgeBase/genUSearchReconciler.js'
      - 'modules/knowledgeBase/genUSearchReconciliationService.js'
      - 'modules/knowledgeBase/genUSearchMemTable.js'
      - 'modules/knowledgeBase/genUSearchPhysicalCoverageWriter.js'
      - 'rust-vexus-lite/Cargo.lock'
      - 'rust-vexus-lite/Cargo.toml'
      - 'rust-vexus-lite/index.d.ts'
      - 'rust-vexus-lite/src/lib.rs'
      - 'tests/gen-usearch/g1/**'
      - 'tests/gen-usearch/g2/**'
      - 'tests/tagIndexGenerationalBaseline.test.js'
      - '.github/workflows/gen-usearch-g1.yml'
      - '.github/workflows/gen-usearch-g2.yml'
  pull_request:
    paths:
      - 'contracts/gen-usearch/g2/**'
      - 'contracts/gen-usearch/g1/**'
      - 'KnowledgeBaseManager.js'
      - 'config.env.example'
      - 'modules/knowledgeBase/indexRepository.js'
      - 'modules/knowledgeBase/schemaManager.js'
      - 'modules/knowledgeBase/genUSearchMetadataStore.js'
      - 'modules/knowledgeBase/genUSearchReconciler.js'
      - 'modules/knowledgeBase/genUSearchReconciliationService.js'
      - 'modules/knowledgeBase/genUSearchMemTable.js'
      - 'modules/knowledgeBase/genUSearchPhysicalCoverageWriter.js'
      - 'rust-vexus-lite/Cargo.lock'
      - 'rust-vexus-lite/Cargo.toml'
      - 'rust-vexus-lite/index.d.ts'
      - 'rust-vexus-lite/src/lib.rs'
      - 'tests/gen-usearch/g1/**'
      - 'tests/gen-usearch/g2/**'
      - 'tests/tagIndexGenerationalBaseline.test.js'
      - '.github/workflows/gen-usearch-g1.yml'
      - '.github/workflows/gen-usearch-g2.yml'

permissions:
  contents: read

jobs:
  g2-physical-layer:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Install G1 regression dependencies
        run: npm ci --prefix tests/gen-usearch/g1 --no-audit --no-fund

      - name: Install G2 physical-layer dependencies
        run: npm ci --prefix tests/gen-usearch/g2 --no-audit --no-fund

      - name: Verify Gen-USearch 64-bit key parser in Rust
        run: cargo test --manifest-path rust-vexus-lite/Cargo.toml gen_usearch_key_tests

      - name: Install pinned N-API build CLI
        run: npm install --prefix rust-vexus-lite --ignore-scripts --no-save --package-lock=false --no-audit --no-fund @napi-rs/cli@2.16.0

      - name: Build Vexus native addon from exact source
        run: |
          cd rust-vexus-lite
          ./node_modules/.bin/napi build --platform

      - name: Regress G1 signed-int64 ABI
        run: node --test tests/gen-usearch/g1/vexusKey64Abi.test.js

      - name: Regress G1 durable metadata and MVCC
        run: node --test tests/gen-usearch/g1/genUSearchMetadataStore.test.js

      - name: Regress G1 reconciliation
        run: node --test tests/gen-usearch/g1/genUSearchReconciler.test.js tests/gen-usearch/g1/genUSearchReconciliationService.test.js

      - name: Regress G1 authority boundary
        run: node --test tests/gen-usearch/g1/g1StageBoundary.test.js

      - name: Regress upstream baseline compatibility
        run: |
          node --test tests/gen-usearch/g1/tagBaselineSchemaCompatibility.test.js
          NODE_PATH="$GITHUB_WORKSPACE/tests/gen-usearch/g1/node_modules" node --test tests/tagIndexGenerationalBaseline.test.js

      - name: Run G2 physical-layer acceptance
        run: NODE_PATH="$GITHUB_WORKSPACE/tests/gen-usearch/g2/node_modules" node --test tests/gen-usearch/g2/g2PhysicalLayer.test.js

      - name: Enforce G2 authority boundary
        run: node --test tests/gen-usearch/g2/g2StageBoundary.test.js
